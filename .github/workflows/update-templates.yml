name: Update template index

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate template index
        run: |
          python3 <<'PY'
          import json
          import os

          templates_dir = "templates"
          templates = []

          if os.path.isdir(templates_dir):

              for folder in sorted(os.listdir(templates_dir)):

                  folder_path = os.path.join(
                      templates_dir,
                      folder
                  )

                  config_path = os.path.join(
                      folder_path,
                      "template.json"
                  )

                  if not os.path.isdir(folder_path):
                      continue

                  if not os.path.isfile(config_path):
                      continue

                  try:

                      with open(
                          config_path,
                          "r",
                          encoding="utf-8"
                      ) as f:

                          config = json.load(f)

                      templates.append({
                          "id": folder,
                          "name": config.get(
                              "name",
                              folder
                          ),
                          "description": config.get(
                              "description",
                              ""
                          )
                      })

                  except Exception as e:

                      print(
                          f"Nelze načíst {config_path}: {e}"
                      )


          output_path = os.path.join(
              templates_dir,
              "index.json"
          )


          with open(
              output_path,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  templates,
                  f,
                  ensure_ascii=False,
                  indent=4
              )

          print(
              f"Nalezeno šablon: {len(templates)}"
          )

          PY

      - name: Commit updated index
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add templates/index.json

          if git diff --cached --quiet; then

            echo "Index se nezměnil."

          else

            git commit \
              -m "Automatically update template index"

            git push

          fi
